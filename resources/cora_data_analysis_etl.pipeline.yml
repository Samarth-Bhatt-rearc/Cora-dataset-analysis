# The main pipeline for cora_data_analysis

resources:
  pipelines:
    cora_data_analysis_etl:
      name: cora_data_analysis_etl
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      root_path: "../src/cora_data_analysis_etl"
      libraries:
        - glob:
            include: ../src/cora_data_analysis_etl/transformations/**
      
      configuration:
        pipelines.numUpdateRetryAttempts: "0"
        pipelines.maxFlowRetryAttempts: "0"

      environment:
        dependencies:
          # We include every dependency defined by pyproject.toml by defining an editable environment
          # that points to the folder where pyproject.toml is deployed.
          - --editable ${workspace.file_path}