# A sample job for cora_data_analysis.

resources:
  jobs:
    sample_job:
      name: cora_data_analysis_job

      trigger:
        periodic:
          interval: 1
          unit: DAYS

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        - task_key: get_file_paths
          spark_python_task:
            python_file: ../src/cora_data_analysis/main.py

          environment_key: default
        - task_key: refresh_pipeline
          depends_on: 
            - task_key: get_file_paths
          pipeline_task:
            pipeline_id: ${resources.pipelines.cora_data_analysis_etl.id}

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
